name: refresh-soccer

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5,11,17,23 * * *"   # 4x daily during the World Cup; relax to daily after the final

concurrency:
  group: spine-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Preserve last published metadata
        run: |
          cp distillates/soccer/meta.json "$RUNNER_TEMP/soccer-previous-meta.json"
          rm -f distillates/soccer/freshness_status.json

      # Each stage below writes distillates/soccer/freshness_status.json on
      # failure (stage, error category, attempts, vintages, run id). The file is
      # evidence only: publication still depends on the verify step exiting 0.
      - name: Pull raw sources (martj42 international results)
        run: python scripts/pull_soccer.py

      - name: Distill
        run: python scripts/distill_soccer.py

      - name: Verify calendar and independent fixture coverage
        run: python scripts/soccer_freshness.py --previous-meta "$RUNNER_TEMP/soccer-previous-meta.json"

      - name: Commit refreshed distillates
        id: publish
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "spine-bot"
          git config user.email "spine-bot@users.noreply.github.com"
          git add data/soccer/raw distillates/soccer
          git diff --cached --quiet || git commit -m "refresh: soccer distillates $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)
          {
            echo "## Soccer publish"
            echo '```'
            echo "HEAD $(git rev-parse HEAD)"
            git log -1 --format='%h %s' -- distillates/soccer
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record publish failure
        if: failure() && steps.publish.outcome == 'failure'
        run: python scripts/soccer_diagnostics.py --annotate --stage publish --message "commit/push failed; last-good distillates remain published"

      # A failing job with no diagnostic is itself a defect. Write an explicit
      # gap record (rather than letting upload silently find nothing) so the
      # absence is visible in the artifact and the step summary.
      - name: Ensure a diagnostic exists
        if: always()
        run: python scripts/soccer_diagnostics.py --if-missing --stage workflow --message "no stage wrote a diagnostic; inspect the job log"

      - name: Retain freshness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: distillates/soccer/freshness_status.json
          if-no-files-found: error
          retention-days: 30
