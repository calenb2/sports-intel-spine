name: refresh-soccer

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5,11,17,23 * * *"   # 4x daily during the World Cup; relax to daily after the final

concurrency:
  group: spine-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Preserve last published metadata
        run: |
          cp distillates/soccer/meta.json "$RUNNER_TEMP/soccer-previous-meta.json"
          rm -f distillates/soccer/freshness_status.json

      - name: Pull raw sources (martj42 international results)
        run: python scripts/pull_soccer.py

      - name: Distill
        run: python scripts/distill_soccer.py

      - name: Verify calendar and independent fixture coverage
        run: python scripts/soccer_freshness.py --previous-meta "$RUNNER_TEMP/soccer-previous-meta.json"

      - name: Retain freshness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-freshness-${{ github.run_id }}
          path: distillates/soccer/freshness_status.json
          if-no-files-found: ignore

      - name: Commit refreshed distillates
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "spine-bot"
          git config user.email "spine-bot@users.noreply.github.com"
          git add data/soccer/raw distillates/soccer
          git diff --cached --quiet || git commit -m "refresh: soccer distillates $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)
