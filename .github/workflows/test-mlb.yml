name: test-mlb-season-policy
on:
  pull_request:
    paths:
      - 'scripts/*mlb*.py'
      - 'tests/test_*mlb*.py'
      - '.github/workflows/*mlb*.yml'
  push:
    branches: ['fix/mlb-season-aware-2026-11-01']
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*mlb*.py' -v
