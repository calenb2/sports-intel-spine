name: refresh-mlb

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *"        # daily 09:00 UTC; keep enabled to discover next season and restart automatically

concurrency:
  group: spine-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Distill MLB (statsapi is fetched inside the script)
        run: python scripts/distill_mlb.py

      - name: Season-aware freshness and restart ledger
        run: python scripts/mlb_season.py

      - name: Commit refreshed distillates
        run: |
          git config user.name "spine-bot"
          git config user.email "spine-bot@users.noreply.github.com"
          git add distillates/mlb/
          git diff --cached --quiet || git commit -m "refresh: mlb distillates $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push || (git pull --rebase origin main && git push)

