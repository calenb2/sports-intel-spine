name: test-soccer-freshness
on:
  pull_request:
    paths:
      - 'scripts/*soccer*.py'
      - 'tests/test_*soccer*.py'
      - 'data/soccer/*.json'
      - '.github/workflows/*soccer*.yml'
  push:
    branches: ['fix/soccer-**']
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*soccer*.py' -v
